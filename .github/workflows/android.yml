name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure Persistent Keystore
      run: |
        if [ ! -f keystore/debug.keystore ] || ! keytool -list -keystore keystore/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
          echo "Generating valid debug.keystore with keytool..."
          mkdir -p keystore
          rm -f keystore/debug.keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12
        fi
        echo "=== Keystore Details ==="
        keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey

    - name: Build APK
      run: |
        set -o pipefail
        ./gradlew assemble --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log

    - name: Extract Error Context
      if: always()
      run: python3 .github/scripts/extract_error.py

    - name: Upload Error Summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-error-summary
        path: build_error_summary.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: PLateLauncher-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 14

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: app/build/outputs/apk/**/*.apk
        generate_release_notes: true

