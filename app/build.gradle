plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def vMajor = (versionProps['version_major'] ?: "1").toInteger()
def vMinor = (versionProps['version_minor'] ?: "0").toInteger()
def vCode = (versionProps['version_code'] ?: 3600).toInteger()

def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
if (ciRunNumber != null && ciRunNumber.isInteger()) {
    vCode = Math.max(vCode, 3600 + ciRunNumber.toInteger())
} else {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def countStr = stdout.toString().trim()
        if (countStr.isInteger()) {
            vCode = Math.max(vCode, 3600 + countStr.toInteger())
        }
    } catch (Exception ignored) {}
}

tasks.register('bumpVersion') {
    description = "Increments minor version in version.properties"
    doLast {
        def propsFile = rootProject.file('version.properties')
        def props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }
        int curMinor = (props['version_minor'] ?: "0").toInteger()
        int nextMinor = curMinor + 1
        props['version_major'] = (props['version_major'] ?: "1").toString()
        props['version_minor'] = nextMinor.toString()
        props['version_code'] = (3600 + nextMinor).toString()
        propsFile.withOutputStream { props.store(it, "PLate.Dex Build Version Configuration") }
        println "Bumped version to v${props['version_major']}.${nextMinor} (versionCode: ${3600 + nextMinor})"
    }
}

def calculatedVersionName = "${vMajor}.${vMinor}"
def calculatedVersionCode = vCode

android {
    namespace "com.youki.dex"
    compileSdk 35

    signingConfigs {
        plateSign {
            def keystoreFile = rootProject.file('keystore/debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "com.youki.dex"
        minSdk 26
        targetSdk 35
        versionCode calculatedVersionCode
        versionName calculatedVersionName
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            // NOTE: "x86" (32-bit) intentionally omitted — matches minSdk 26
            // (Android 8.0+) targeting real devices; 32-bit x86 Android
            // devices are effectively nonexistent among app.build.gradle's
            // actual target audience (emulators use x86_64).
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.plateSign
        }
        release {
            signingConfig signingConfigs.plateSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "PLateDex-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/LICENSE.md'
            excludes += '/META-INF/LICENSE-notice.md'
            excludes += '/META-INF/DEPENDENCIES'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
            excludes += '/META-INF/logwirez_release.kotlin_module'
            excludes += '/META-INF/*.kotlin_module'
            pickFirst 'META-INF/LICENSE.md'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0-alpha10'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'

    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}
